[tools]
"github:tailwindlabs/tailwindcss" = "4.3.3"
go = "1.26.5"
"go:github.com/a-h/templ/cmd/templ" = "0.3.1020"
"go:github.com/air-verse/air" = "1.67.4"
golangci-lint = "2.12.2"
git-cliff = "2.13.1"

[hooks]
enter = 'git config core.hooksPath .githooks 2>/dev/null || true'

[env]
CGO_ENABLED = "0"

# ── Development ───────────────────────────────────────────────

[tasks.dev]
description = "Start development servers (templ + tailwind + air)"
depends = ["dev:templ-watch", "dev:tailwind-watch", "dev:air"]
wait_for = ["generate"]

[tasks."dev:templ-watch"]
description = "Watch and regenerate templ files"
run = "templ generate --watch"

[tasks."dev:tailwind-watch"]
description = "Watch and rebuild Tailwind CSS"
run = "tailwindcss -i assets/input.css -o assets/dist/styles.min.css --watch --minify"

[tasks."dev:air"]
description = "Run Go with hot reload"
run = "air"

# ── Code generation ───────────────────────────────────────────

[tasks.generate]
description = "Generate templ and Tailwind CSS"
run = """
mkdir -p assets/dist
templ generate
tailwindcss -i assets/input.css -o assets/dist/styles.min.css --minify
curl -fsSL https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js -o assets/dist/chart.umd.min.js
curl -fsSL https://cdn.jsdelivr.net/npm/temporal-polyfill@0.3.2/global.min.js -o assets/dist/temporal-polyfill.global.min.js
"""
sources = ["internal/templates/**/*.templ", "assets/input.css"]
outputs = [
  "internal/templates/**/*_templ.go",
  "assets/dist/styles.min.css",
  "assets/dist/chart.umd.min.js",
  "assets/dist/temporal-polyfill.global.min.js",
]

# ── Build ─────────────────────────────────────────────────────

[tasks.build]
description = "Build production binary"
depends = ["generate"]
run = 'go build -trimpath -ldflags="-s -w" -o meridian ./cmd/meridian'
sources = ["**/*.go", "go.mod", "go.sum"]
outputs = ["meridian"]

# ── Test ──────────────────────────────────────────────────────

[tasks.test]
description = "Run all tests"
depends = ["generate"]
run = "go test -race ./..."
env = { CGO_ENABLED = "1" }

[tasks."test:verbose"]
description = "Run all tests with verbose output"
depends = ["generate"]
run = "go test -race -v ./..."
env = { CGO_ENABLED = "1" }

[tasks."test:engine"]
description = "Run engine tests only"
depends = ["generate"]
run = "go test -race -v ./internal/engine/"
env = { CGO_ENABLED = "1" }

# ── Lint & format ─────────────────────────────────────────────

[tasks.lint]
description = "Run golangci-lint"
depends = ["generate"]
run = "golangci-lint run ./..."

[tasks."lint:fix"]
description = "Run golangci-lint with auto-fix"
depends = ["generate"]
run = "golangci-lint run --fix ./..."

[tasks.fmt]
description = "Format Go code via golangci-lint"
run = "golangci-lint fmt ./..."

[tasks.tidy]
description = "Tidy go.mod"
depends = ["generate"]
run = "go mod tidy"

[tasks."tidy:check"]
description = "Check that go.mod and go.sum are tidy"
depends = ["generate"]
run = "go mod tidy -diff"

[tasks.check]
description = "Run generation, lint, tests, build, and module checks"
depends = ["lint", "test", "build", "tidy:check"]

# ── Git hooks ─────────────────────────────────────────────────

[tasks.pre-commit]
description = "Run the same checks as CI"
depends = ["check"]

# ── Release ───────────────────────────────────────────────────

[tasks.changelog]
description = "Preview changelog for unreleased commits"
run = "git cliff --unreleased"

[tasks."changelog:full"]
description = "Generate full CHANGELOG.md"
run = "git cliff -o CHANGELOG.md"

[tasks."release:next"]
description = "Show what the next version would be"
run = "git cliff --bumped-version"

# ── Clean ─────────────────────────────────────────────────────

[tasks.clean]
description = "Remove build artifacts"
run = """
rm -f meridian
rm -rf assets/dist
find . -name '*_templ.go' -delete
"""
