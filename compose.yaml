services:
  meridian:
    image: ghcr.io/drewbitt/meridian:${MERIDIAN_TAG:-beta}
    ports:
      - "${MERIDIAN_PORT:-8090}:8090"
    environment:
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-first-user}"
      GOOGLE_HEALTH_CLIENT_ID: "${GOOGLE_HEALTH_CLIENT_ID:-}"
      GOOGLE_HEALTH_CLIENT_SECRET: "${GOOGLE_HEALTH_CLIENT_SECRET:-}"
      TZ: "${TZ:-UTC}"
    volumes:
      - meridian-data:/pb_data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  meridian-data:
